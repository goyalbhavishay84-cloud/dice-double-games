<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Double Games</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1e2f, #2b2b40);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        h1 {
            margin-bottom: 10px;
            color: #00d2ff;
        }
        .subtitle {
            margin-bottom: 30px;
            color: #b0b0c3;
            font-size: 14px;
        }
        .dice-box {
            font-size: 60px;
            margin: 20px 0;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            letter-spacing: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 15px;
        }
        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .score {
            margin-top: 20px;
            font-size: 18px;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🎲 Dice Double Game</h1>
        <p class="subtitle">Bina kisi login ya OTP ke seedha khelo!</p>
        
        <div class="dice-box" id="diceDisplay">🎲 🎲</div>
        
        <button class="btn" onclick="rollDice()">Roll Dice</button>
        
        <div class="score" id="resultText">Dice roll karne ke liye button dabayein!</div>
    </div>

    <script>
        function rollDice() {
            const dice1 = Math.floor(Math.random() * 6) + 1;
            const dice2 = Math.floor(Math.random() * 6) + 1;
            
            const diceEmojis = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            
            document.getElementById('diceDisplay').innerHTML = `${diceEmojis[dice1]} ${diceEmojis[dice2]}`;
            
            if (dice1 === dice2) {
                document.getElementById('resultText').innerHTML = `🎉 Double Aaya! You Win! (${dice1} & ${dice2})`;
            } else {
                document.getElementById('resultText').innerHTML = `Score: ${dice1 + dice2} (${dice1} aur ${dice2})`;
            }
        }
    </script>

</body>
</html>
